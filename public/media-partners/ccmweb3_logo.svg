<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" shape-rendering="crispEdges">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="#000000"/>

  <!-- Corner brackets — top left -->
  <polyline points="5,16 5,5 16,5" fill="none" stroke="#39ff14" stroke-width="2.5" stroke-linecap="square"/>
  <!-- top right -->
  <polyline points="84,5 95,5 95,16" fill="none" stroke="#39ff14" stroke-width="2.5" stroke-linecap="square"/>
  <!-- bottom left -->
  <polyline points="5,84 5,95 16,95" fill="none" stroke="#39ff14" stroke-width="2.5" stroke-linecap="square"/>
  <!-- bottom right -->
  <polyline points="95,84 95,95 84,95" fill="none" stroke="#39ff14" stroke-width="2.5" stroke-linecap="square"/>

  <!-- [ CCM ] -->
  <text
    x="50"
    y="58"
    font-family="'Courier New', Courier, monospace"
    font-size="20"
    font-weight="700"
    fill="#39ff14"
    text-anchor="middle"
    letter-spacing="2"
    filter="url(#glow)"
  >[ CCM ]</text>
</svg>
